# VayuSetu local development stack.
#
# Runs the complete pipeline without any Google Cloud billing:
#   Firebase Local Emulator Suite (Auth, Firestore, Functions, Hosting, Storage)
#   fake-gcs-server standing in for Cloud Storage
#   mock Twilio and mock Google AI Studio servers
#   API gateway, prediction service and the four Cloud Functions
#   a cron-style scheduler that triggers batch prediction
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#   curl -X POST localhost:4010/simulate/inbound -H 'content-type: application/json' \
#        -d '{"from":"+919876543210","latitude":28.6139,"longitude":77.2090}'
#   curl -X POST localhost:4010/simulate/inbound -H 'content-type: application/json' \
#        -d '{"from":"+919876543210","media":"hazy_delhi.jpg","body":"Smoky evening near ITO"}'

name: vayusetu

x-common-env: &common-env
  GCP_PROJECT_ID: ${LOCAL_PROJECT_ID:-vayusetu-local}
  GOOGLE_CLOUD_PROJECT: ${LOCAL_PROJECT_ID:-vayusetu-local}
  GCLOUD_PROJECT: ${LOCAL_PROJECT_ID:-vayusetu-local}
  FIRESTORE_EMULATOR_HOST: firebase:8080
  STORAGE_EMULATOR_HOST: http://gcs:4443
  BIGQUERY_ENABLED: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-twilio-env: &twilio-env
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-ACmock00000000000000000000000000}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-mock-auth-token}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
  TWILIO_VOICE_FROM: ${TWILIO_VOICE_FROM:-+14155238886}
  TWILIO_API_BASE_URL: http://mock-twilio:4010

services:
  firebase:
    build: ./local/firebase
    # The repository root is mounted at /workspace, so the entrypoint that runs is
    # the working-copy file, not the one baked into the image. `sed -i 's/\r$//'`
    # makes that immune to a Windows checkout that stored CRLF (`.gitattributes`
    # prevents it); once `git ls-files --eol local/firebase/entrypoint.sh` reports
    # `i/lf w/lf` the sed is a no-op.
    command: ["sh", "-c", "sed -i 's/\r$//' /workspace/local/firebase/entrypoint.sh && exec /usr/local/bin/entrypoint.sh"]
    environment:
      GCLOUD_PROJECT: ${LOCAL_PROJECT_ID:-vayusetu-local}
      PROCESS_IMAGE_URL: http://fn-process-image:8080
      FETCH_GEE_URL: http://fn-fetch-gee:8080
      ALERTS_URL: http://fn-alerts:8080
      STORAGE_API_URL: http://gcs:4443
      EMULATOR_EXPORT_ON_EXIT: ${EMULATOR_EXPORT_ON_EXIT:-true}
    volumes:
      - ./:/workspace
      - event-bridge-modules:/workspace/local/event-bridge/node_modules
    ports:
      - "4000:4000"   # Emulator UI
      - "5000:5000"   # Hosting (serves frontend/out)
      - "5001:5001"   # Functions (event bridge)
      - "8080:8080"   # Firestore
      - "9099:9099"   # Auth
      - "9150:9150"   # Firestore websocket
      - "9199:9199"   # Storage emulator (unused by services; fake-gcs-server is authoritative)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4400/emulators"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command:
      - -scheme=http
      - -port=4443
      - -public-host=gcs:4443
      - -external-url=http://gcs:4443
      - -backend=memory
      - -data=/data
    volumes:
      - ./local/gcs/data:/data:ro
    ports:
      - "4443:4443"

  mock-twilio:
    build: ./local/mock-twilio
    environment:
      PORT: "4010"
      GATEWAY_WEBHOOK_URL: http://api-gateway:8080/webhooks/twilio/whatsapp
      MOCK_TWILIO_PUBLIC_URL: http://mock-twilio:4010
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-ACmock00000000000000000000000000}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-+14155238886}
    ports:
      - "4010:4010"

  mock-google-ai:
    build: ./local/mock-google-ai
    environment:
      PORT: "4020"
      MOCK_AVAILABLE_MODELS: ${MOCK_AVAILABLE_MODELS:-gemini-2.5-flash,gemini-flash-latest}
      MOCK_RATE_LIMIT_PROBABILITY: ${MOCK_RATE_LIMIT_PROBABILITY:-0.1}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-400}
    ports:
      - "4020:4020"

  api-gateway:
    build: ./services/api-gateway
    environment:
      <<: [*common-env, *twilio-env]
      NODE_ENV: development
      PORT: "8080"
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      GCS_BUCKET: ${CITIZEN_IMAGES_BUCKET:-vayusetu-local-citizen-images}
      GCS_REPORT_PREFIX: reports
      TWILIO_VALIDATE_SIGNATURE: "false"
      TWILIO_MEDIA_BASE_URL: http://mock-twilio:4010
      PHONE_HASH_SECRET: ${PHONE_HASH_SECRET:-local-development-phone-hash-secret}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-example.gov.in}
      HOTSPOT_GEOHASH_PRECISION: ${HOTSPOT_GEOHASH_PRECISION:-5}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-120}
    ports:
      - "8081:8080"
    depends_on:
      firebase:
        condition: service_healthy
      gcs:
        condition: service_started
      mock-twilio:
        condition: service_started

  prediction-service:
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    environment:
      GCP_PROJECT_ID: ${LOCAL_PROJECT_ID:-vayusetu-local}
      PORT: "8080"
      MODEL_PATH: /app/model/model.joblib
      PREFER_GCS_MODEL: "false"
      FORECAST_HORIZON_HOURS: "12"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8090:8080"

  fn-process-image:
    build:
      context: .
      dockerfile: functions/Dockerfile
      args:
        FUNCTION_DIR: process_citizen_image
        FUNCTION_TARGET: process_citizen_image
        FUNCTION_SIGNATURE_TYPE: cloudevent
    environment:
      <<: [*common-env, *twilio-env]
      CITIZEN_IMAGES_BUCKET: ${CITIZEN_IMAGES_BUCKET:-vayusetu-local-citizen-images}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY:-mock-api-key}
      GEMINI_API_ENDPOINT: ${GEMINI_API_ENDPOINT:-http://mock-google-ai:4020}
      GEMINI_MODEL_CANDIDATES: ${GEMINI_MODEL_CANDIDATES:-gemini-1.5-flash,gemini-flash-latest,gemini-2.5-flash}
    ports:
      - "8082:8080"
    depends_on:
      firebase:
        condition: service_healthy
      mock-google-ai:
        condition: service_started

  fn-fetch-gee:
    build:
      context: .
      dockerfile: functions/Dockerfile
      args:
        FUNCTION_DIR: fetch_gee_metrics
        FUNCTION_TARGET: fetch_gee_metrics
        FUNCTION_SIGNATURE_TYPE: cloudevent
    environment:
      <<: *common-env
      GEE_MOCK: ${GEE_MOCK:-true}
      GEE_PROJECT: ${GEE_PROJECT:-}
      GEE_BUFFER_METERS: "5000"
      GEE_LOOKBACK_DAYS: "3"
    ports:
      - "8083:8080"
    depends_on:
      firebase:
        condition: service_healthy

  fn-alerts:
    build:
      context: .
      dockerfile: functions/Dockerfile
      args:
        FUNCTION_DIR: send_authority_alerts
        FUNCTION_TARGET: send_authority_alerts
        FUNCTION_SIGNATURE_TYPE: cloudevent
    environment:
      <<: [*common-env, *twilio-env]
      ALERTS_MOCK_GOOGLE_APIS: ${ALERTS_MOCK_GOOGLE_APIS:-true}
      ALERTS_DRY_RUN: ${ALERTS_DRY_RUN:-false}
      ALERT_AUDIO_BUCKET: ""
      ALERT_AQI_THRESHOLD: ${ALERT_AQI_THRESHOLD:-300}
      DASHBOARD_URL: http://localhost:3000
    ports:
      - "8084:8080"
    depends_on:
      firebase:
        condition: service_healthy
      mock-twilio:
        condition: service_started

  fn-batch:
    build:
      context: .
      dockerfile: functions/Dockerfile
      args:
        FUNCTION_DIR: batch_predict
        FUNCTION_TARGET: batch_predict
        FUNCTION_SIGNATURE_TYPE: http
    environment:
      <<: *common-env
      DATA_SOURCE: firestore
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-synthetic}
      PREDICTION_SERVICE_URL: http://prediction-service:8080
      PREDICTION_SERVICE_AUTH: "false"
      ALERT_AQI_THRESHOLD: ${ALERT_AQI_THRESHOLD:-300}
      HOTSPOT_GEOHASH_PRECISION: ${HOTSPOT_GEOHASH_PRECISION:-5}
      LOOKBACK_HOURS: ${BATCH_LOOKBACK_HOURS:-6}
      MIN_REPORTS_PER_CELL: "1"
    ports:
      - "8085:8080"
    depends_on:
      firebase:
        condition: service_healthy
      prediction-service:
        condition: service_started

  # Stand-in for Cloud Scheduler: triggers batch prediction on an interval.
  scheduler:
    image: curlimages/curl:8.10.1
    command:
      - sh
      - -c
      - |
        sleep 45
        while true; do
          echo "[scheduler] triggering batch prediction"
          curl -sS -X POST http://fn-batch:8080/ \
            -H 'content-type: application/json' \
            -d '{"trigger":"local-scheduler","lookback_hours":${BATCH_LOOKBACK_HOURS:-6}}' || true
          echo
          sleep ${BATCH_INTERVAL_SECONDS:-600}
        done
    depends_on:
      - fn-batch

  dashboard:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_USE_EMULATORS: "true"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${LOCAL_PROJECT_ID:-vayusetu-local}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST: localhost:8080
      NEXT_PUBLIC_AUTH_EMULATOR_URL: http://localhost:9099
      NEXT_PUBLIC_ADMIN_DOMAIN: ${ADMIN_DOMAIN:-example.gov.in}
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8081
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
      NEXT_PUBLIC_DEFAULT_MAP_CENTER: ${DEFAULT_MAP_CENTER:-28.6139,77.2090}
    volumes:
      - ./frontend:/app
      - dashboard-modules:/app/node_modules
      - dashboard-next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      firebase:
        condition: service_healthy

volumes:
  event-bridge-modules:
  dashboard-modules:
  dashboard-next:
