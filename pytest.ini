[pytest]
minversion = 7.0
testpaths =
    functions/common/tests
    functions/process_citizen_image/tests
    functions/fetch_gee_metrics/tests
    functions/send_authority_alerts/tests
    functions/batch_predict/tests
    services/prediction-service/tests
    ml/tests
pythonpath =
    functions/common
    ml
    services/prediction-service
addopts = -ra --strict-markers --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    integration: tests that require live external services
