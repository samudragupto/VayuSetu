name: Frontend - build and deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - ".github/workflows/frontend-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Lint, type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
      NEXT_PUBLIC_ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
      NEXT_PUBLIC_API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
      NEXT_PUBLIC_DEFAULT_MAP_CENTER: ${{ vars.DEFAULT_MAP_CENTER || '28.6139,77.2090' }}
      NEXT_PUBLIC_USE_EMULATORS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 3

  deploy:
    name: Deploy to Firebase Hosting
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ vars.ENVIRONMENT || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13

      - name: Deploy Firestore security rules
        run: |
          firebase deploy \
            --only firestore:rules \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive \
            --force

      - name: Deploy hosting
        run: |
          firebase deploy \
            --only hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive \
            --message "Deploy ${GITHUB_SHA::7} by ${GITHUB_ACTOR}"

      - name: Summary
        run: |
          {
            echo "## VayuSetu dashboard deployed"
            echo ""
            echo "Project: ${{ vars.GCP_PROJECT_ID }}"
            echo "Commit: ${GITHUB_SHA::7}"
          } >> "$GITHUB_STEP_SUMMARY"
