name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform.yml"
      - "scripts/check_deploy_config.sh"
      - "scripts/deployment_preflight.sh"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform.yml"
      - "scripts/check_deploy_config.sh"
      - "scripts/deployment_preflight.sh"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKING_DIR: infrastructure/terraform

jobs:
  # A checkout without cloud configuration is normal, so ask before planning and
  # skip rather than fail. `terraform fmt -check` stays inside the gated job
  # below: it needs no cloud access, but it does need a Terraform binary, so
  # running it in a job that is skipped costs nothing and keeps one gate.
  deployment-preflight:
    name: Deployment preflight
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.check.outputs.terraform_configured }}
    steps:
      - uses: actions/checkout@v4

      - name: Report whether Terraform is configured
        id: check
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
        run: bash scripts/deployment_preflight.sh terraform

  terraform:
    name: Plan and apply
    needs: deployment-preflight
    if: needs.deployment-preflight.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    environment: ${{ vars.ENVIRONMENT || 'dev' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      TF_VAR_firestore_location: ${{ vars.FIRESTORE_LOCATION || vars.GCP_REGION || 'us-central1' }}
      TF_VAR_bigquery_location: ${{ vars.BIGQUERY_LOCATION || 'US' }}
      TF_VAR_environment: ${{ vars.ENVIRONMENT || 'dev' }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_admin_domain: ${{ vars.ADMIN_DOMAIN }}
      TF_VAR_gemini_model_candidates: ${{ vars.GEMINI_MODEL_CANDIDATES || 'gemini-1.5-flash,gemini-flash-latest,gemini-3.5-flash-lite,gemini-2.5-flash' }}
      TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TF_VAR_twilio_whatsapp_from: ${{ secrets.TWILIO_WHATSAPP_FROM }}
      TF_VAR_twilio_voice_from: ${{ secrets.TWILIO_VOICE_FROM }}
      TF_VAR_google_ai_studio_api_key: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
      TF_VAR_phone_hash_secret: ${{ secrets.PHONE_HASH_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
        run: bash "$GITHUB_WORKSPACE/scripts/check_deploy_config.sh" terraform

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform format check
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=vayusetu/${{ vars.ENVIRONMENT || 'dev' }}"

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'destroy'
        run: |
          set -o pipefail
          terraform plan -no-color -lock-timeout=300s -out=tfplan 2>&1 | tee plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Terraform plan (destroy)
        id: plan_destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          set -o pipefail
          terraform plan -destroy -no-color -lock-timeout=300s -out=tfplan 2>&1 | tee plan.txt

      - name: Publish plan to pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.WORKING_DIR}/plan.txt`;
            let plan = fs.readFileSync(path, 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n... (truncated, see workflow logs for the full plan)';
            }
            const body = [
              '### Terraform plan for `' + process.env.WORKING_DIR + '`',
              '',
              '| Step | Result |',
              '| --- | --- |',
              '| fmt | `${{ steps.fmt.outcome }}` |',
              '| init | `${{ steps.init.outcome }}` |',
              '| validate | `${{ steps.validate.outcome }}` |',
              '| plan | `${{ steps.plan.outcome }}` |',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              `Triggered by @${context.actor} for commit ${context.sha.substring(0, 7)}.`
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Terraform apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy'))
        run: terraform apply -no-color -lock-timeout=300s -auto-approve tfplan

      - name: Export outputs for downstream pipelines
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          terraform output -json > outputs.json
          echo "### Terraform outputs" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          terraform output -json github_repository_variables >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload outputs artifact
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: ${{ env.WORKING_DIR }}/outputs.json
          retention-days: 7
